<div class="section-trusted flat-spacing-5">
  <div class="container">
    <div class="wg-trusted">
      <div class="frame-image image-1">
        <div class="ghim">
          <img
            class="wow fadeZoom"
            loading="lazy"
            width="45"
            height="57"
            src="/themes/rosaline/source/assets/images/item/push-pin.png"
            alt="Image"
          />
        </div>
        <div class="image wow fadeIn">
          <img
            class="wow fadeZoomOut"
            loading="lazy"
            width="332"
            height="409"
            alt="Image"
            [src]="field('image1') || null"
            [storeEditImage]="id() + '.image1'"
            [editValue]="field('image1')"
          />
        </div>
      </div>
      <div class="frame-image image-2">
        <div class="ghim">
          <img
            class="wow fadeZoom"
            loading="lazy"
            width="45"
            height="57"
            src="/themes/rosaline/source/assets/images/item/push-pin.png"
            alt="Image"
          />
        </div>
        <div class="image wow fadeIn">
          <img
            class="wow fadeZoomOut"
            loading="lazy"
            width="332"
            height="409"
            alt="Image"
            [src]="field('image2') || null"
            [storeEditImage]="id() + '.image2'"
            [editValue]="field('image2')"
          />
        </div>
      </div>
      <div class="content">
        <div class="sect-heading-v2 space-inner-1 m-0">
          <div class="badge-pill">
            <span
              class="font-geist fw-medium lh-22 letter-space--3"
              [storeEditText]="id() + '.eyebrow'"
              [editValue]="field('eyebrow')"
            ></span>
          </div>
          <h3
            class="font-anton lh-xl-53 text-uppercase letter-space--2 text-color-change"
            [storeEditText]="id() + '.title'"
            [editValue]="field('title')"
            [storeEditText]="id() + '.text'"
            [editValue]="field('text')"
          ></h3>
        </div>
      </div>
    </div>
    <ul class="list-certified wow fadeInUp">
      <li>
        <div class="leave left">
          <img
            loading="lazy"
            width="40"
            height="64"
            src="/themes/rosaline/source/assets/images/item/cer-left.svg"
            alt="Image"
          />
        </div>
        <div class="certified letter-space--3 cl-text-5 text-uppercase">
          <p
            class="name_cer font-geist text-body-s fw-normal lh-18"
            [storeEditText]="id() + '.certLabel1'"
            [editValue]="field('certLabel1')"
          ></p>
          <h6
            class="font-anton"
            [storeEditText]="id() + '.certTitle1'"
            [editValue]="field('certTitle1')"
          ></h6>
        </div>
        <div class="leave right">
          <img
            loading="lazy"
            width="40"
            height="64"
            src="/themes/rosaline/source/assets/images/item/cer-right.svg"
            alt="Image"
          />
        </div>
      </li>
      <li>
        <div class="leave left">
          <img
            loading="lazy"
            width="60"
            height="96"
            src="/themes/rosaline/source/assets/images/item/cer-left.svg"
            alt="Image"
          />
        </div>
        <div class="certified letter-space--3 cl-text-5 text-uppercase">
          <p
            class="name_cer font-geist text-body-l fw-normal"
            [storeEditText]="id() + '.certLabel2'"
            [editValue]="field('certLabel2')"
          ></p>
          <h5
            class="font-anton"
            [storeEditText]="id() + '.certTitle2'"
            [editValue]="field('certTitle2')"
          ></h5>
        </div>
        <div class="leave right">
          <img
            loading="lazy"
            width="60"
            height="96"
            src="/themes/rosaline/source/assets/images/item/cer-right.svg"
            alt="Image"
          />
        </div>
      </li>
      <li>
        <div class="leave left">
          <img
            loading="lazy"
            width="40"
            height="64"
            src="/themes/rosaline/source/assets/images/item/cer-left.svg"
            alt="Image"
          />
        </div>
        <div class="certified letter-space--3 cl-text-5 text-uppercase">
          <p
            class="name_cer font-geist text-body-s fw-normal lh-18"
            [storeEditText]="id() + '.certLabel3'"
            [editValue]="field('certLabel3')"
          ></p>
          <h6
            class="font-anton"
            [storeEditText]="id() + '.certTitle3'"
            [editValue]="field('certTitle3')"
          ></h6>
        </div>
        <div class="leave right">
          <img
            loading="lazy"
            width="40"
            height="64"
            src="/themes/rosaline/source/assets/images/item/cer-right.svg"
            alt="Image"
          />
        </div>
      </li>
    </ul>
  </div>
</div>
