<section class="help tw:mx-auto tw:min-w-0">
  <ds-page-header title="Ayuda rápida" icon="circleHelp" description="Temas frecuentes para configurar y vender con VendedorIA." />

  <ul class="help__list tw:md:grid-cols-2">
    @for (topic of topics; track topic.link) {
      <li>
        <article class="tw:console-card">
          <h2>{{ topic.title }}</h2>
          <p>{{ topic.body }}</p>
          <a class="tw:inline-flex tw:min-h-touch tw:items-center" [routerLink]="topic.link">{{ topic.cta }} →</a>
        </article>
      </li>
    }
  </ul>

  <aside class="help__tip">
    <ds-icon name="circleHelp" />
    <div>
      <strong>Atajo</strong>
      <p>Pulsa <kbd>Ctrl</kbd> + <kbd>K</kbd> en cualquier pantalla de la consola para saltar a una sección.</p>
    </div>
  </aside>
</section>
